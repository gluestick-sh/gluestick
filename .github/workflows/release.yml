# Tag push: build → package → GitHub Release → https://gluestick.sh/releases/cli/
# Manual (workflow_dispatch): re-sync an existing release's artifacts to the site.
#
# Secrets (org recommended): GLUESTICK_SSH_HOST, GLUESTICK_SSH_PORT,
#   GLUESTICK_SSH_USER, GLUESTICK_SSH_KEY, GLUESTICK_SSH_PATH,
#   optional GLUESTICK_SSH_PASSPHRASE / GLUESTICK_SSH_KNOWN_HOSTS
# Upload target: $GLUESTICK_SSH_PATH/cli/ → https://gluestick.sh/releases/cli/

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to sync to gluestick.sh (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          # Read the channel from rust-toolchain.toml so this workflow never
          # drifts from the version build.ps1 uses. Targets are architectural
          # constants for this Windows amd64/arm64 product.
          $toml = Get-Content -LiteralPath 'rust-toolchain.toml' -Raw
          if ($toml -match '(?m)^\s*channel\s*=\s*"([^"]+)"') {
            $channel = $Matches[1]
          } else {
            throw 'Could not read the pinned Rust channel from rust-toolchain.toml.'
          }
          rustup toolchain install $channel --profile minimal
          rustup target add x86_64-pc-windows-msvc --toolchain $channel
          rustup target add aarch64-pc-windows-msvc --toolchain $channel
          rustup show

      - name: Install NSIS
        run: |
          if (Get-Command makensis.exe -ErrorAction SilentlyContinue) {
            Write-Host "NSIS found on PATH."
          } elseif (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'NSIS\Bin\makensis.exe')) {
            Write-Host "NSIS found in Program Files."
          } elseif (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'NSIS\Bin\makensis.exe')) {
            Write-Host "NSIS found in Program Files (x86)."
          } else {
            Write-Host "Installing NSIS via Chocolatey..."
            choco install nsis --no-progress --yes
          }

      - name: Validate tag against workspace version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^[vV]', ''
          $manifest = Get-Content -LiteralPath 'Cargo.toml' -Raw
          if ($manifest -match '(?ms)^\[workspace\.package\].*?^\s*version\s*=\s*"([^"]+)"') {
            $manifestVersion = $Matches[1]
          } else {
            throw 'Could not read [workspace.package].version from Cargo.toml.'
          }
          if ($version -ne $manifestVersion) {
            throw "Tag '$tag' resolves to version '$version', which does not match [workspace.package].version '$manifestVersion' in Cargo.toml."
          }
          Write-Host "Release version: $version"

      - name: Build and package installers
        run: |
          & .\installer\cli\build.ps1

      - name: Stage release artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath installer/cli/output/GluestickSetup-amd64.exe -Destination dist/ -Force
          Copy-Item -LiteralPath installer/cli/output/GluestickSetup-amd64.exe.sha256 -Destination dist/ -Force
          Copy-Item -LiteralPath installer/cli/output/GluestickSetup-arm64.exe -Destination dist/ -Force
          Copy-Item -LiteralPath installer/cli/output/GluestickSetup-arm64.exe.sha256 -Destination dist/ -Force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes `
            dist/GluestickSetup-amd64.exe `
            dist/GluestickSetup-amd64.exe.sha256 `
            dist/GluestickSetup-arm64.exe `
            dist/GluestickSetup-arm64.exe.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-release
          path: dist
          if-no-files-found: error

  sync-web:
    if: github.event_name == 'workflow_dispatch'
    name: sync from existing release
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" -R "${{ github.repository }}" -D dist \
            -p 'GluestickSetup-amd64.exe' \
            -p 'GluestickSetup-arm64.exe' \
            -p 'GluestickSetup-amd64.exe.sha256' \
            -p 'GluestickSetup-arm64.exe.sha256'
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: cli-release
          path: dist
          if-no-files-found: error

  publish-web:
    name: publish to gluestick.sh
    runs-on: ubuntu-latest
    needs: [release, sync-web]
    if: |
      always() && !cancelled() && (
        needs.release.result == 'success' ||
        needs.sync-web.result == 'success'
      )
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cli-release
          path: dist

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.GLUESTICK_SSH_HOST }}
          SSH_PORT: ${{ secrets.GLUESTICK_SSH_PORT }}
          SSH_KEY: ${{ secrets.GLUESTICK_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.GLUESTICK_SSH_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.GLUESTICK_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Prefer env + printf so multiline PEM secrets stay intact.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

          # Unlock encrypted keys once for later -i IdentitiesOnly=yes commands.
          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            eval "$(ssh-agent -s)"
            export SSH_PASSPHRASE
            printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$SSH_PASSPHRASE"' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass.sh" SSH_ASKPASS_REQUIRE=force \
              ssh-add ~/.ssh/deploy_key </dev/null
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          fi

      - name: Test SSH
        env:
          SSH_HOST: ${{ secrets.GLUESTICK_SSH_HOST }}
          SSH_PORT: ${{ secrets.GLUESTICK_SSH_PORT }}
          SSH_USER: ${{ secrets.GLUESTICK_SSH_USER }}
        run: |
          set -euo pipefail
          ssh \
            -p "${SSH_PORT}" \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "whoami"

      - name: Deploy to gluestick.sh/releases/cli/
        env:
          SSH_HOST: ${{ secrets.GLUESTICK_SSH_HOST }}
          SSH_PORT: ${{ secrets.GLUESTICK_SSH_PORT }}
          SSH_USER: ${{ secrets.GLUESTICK_SSH_USER }}
          SSH_PATH: ${{ secrets.GLUESTICK_SSH_PATH }}
        run: |
          set -euo pipefail
          remote_dir="${SSH_PATH%/}/cli"
          ssh_opts=(-p "${SSH_PORT}" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)

          ls -la dist/

          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p $(printf %q "$remote_dir")"

          # scp uses -P for port (capital P).
          scp \
            -P "${SSH_PORT}" \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            dist/GluestickSetup-amd64.exe \
            dist/GluestickSetup-arm64.exe \
            dist/GluestickSetup-amd64.exe.sha256 \
            dist/GluestickSetup-arm64.exe.sha256 \
            "${SSH_USER}@${SSH_HOST}:${remote_dir}/"

          echo "public URL: https://gluestick.sh/releases/cli/"

      - name: Update downloads.json
        env:
          SSH_HOST: ${{ secrets.GLUESTICK_SSH_HOST }}
          SSH_PORT: ${{ secrets.GLUESTICK_SSH_PORT }}
          SSH_USER: ${{ secrets.GLUESTICK_SSH_USER }}
          SSH_PATH: ${{ secrets.GLUESTICK_SSH_PATH }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          date="$(date -u +%Y-%m-%d)"
          ssh_opts=(-p "${SSH_PORT}" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          parent_dir="$(dirname "${SSH_PATH%/}")"
          data_file="${parent_dir}/data/downloads.json"

          # Pull the live file so groups other than "cli" (e.g. desktop) survive.
          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" "cat '${data_file}'" > /tmp/downloads.json

          amd64_size="$(stat -c%s dist/GluestickSetup-amd64.exe)"
          arm64_size="$(stat -c%s dist/GluestickSetup-arm64.exe)"

          jq --arg v "$version" --arg d "$date" \
            --argjson as "$amd64_size" --argjson ars "$arm64_size" \
            '(.groups[] | select(.id == "cli")) |= (.version = $v | .date = $d | .items |= map(if .arch == "amd64" then .size = $as elif .arch == "arm64" then .size = $ars else . end))' \
            /tmp/downloads.json > /tmp/downloads.json.new
          mv /tmp/downloads.json.new /tmp/downloads.json

          # Atomic replace: upload to a temp file, then move into place.
          scp \
            -P "${SSH_PORT}" \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            /tmp/downloads.json \
            "${SSH_USER}@${SSH_HOST}:${data_file}.tmp"
          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" "mv -f '${data_file}.tmp' '${data_file}'"

          echo "updated ${data_file} (version=$version, date=$date, amd64=$amd64_size, arm64=$arm64_size)"
