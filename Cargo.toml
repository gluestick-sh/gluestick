[workspace]
members = [
    "crates/gluestick-cli",
    "crates/gluestick-core",
    "crates/gluestick-shim",
]
default-members = [
    "crates/gluestick-cli",
    "crates/gluestick-core",
    "crates/gluestick-shim",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
# Toolchain floor this tree is built and tested with (see rust-toolchain.toml).
# Lowering it requires an older-toolchain CI job that proves the floor.
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Argument parsing for `glue`. Every feature here is one the CLI actually
# exercises; `color`/`wrap_help`/`cargo` are left out to keep `glue.exe` small.
clap = { version = "4", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "derive",
] }
thiserror = "2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
native-tls = "0.2"
url = "2"
windows-sys = { version = "0.61", features = [
    "Win32_System_Registry",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
] }
# Blocking native-TLS (schannel on Windows) for HTTPS. The core crate wires the
# TLS connector directly (crate::schannel) instead of through ureq's
# `native-tls` feature, which would pull the `webpki-root-certs` table into the
# binary; there is no async runtime in the tree.
ureq = { version = "3", default-features = false }
http = "1"
# Internal crate. The explicit `version` (matching [workspace.package]) is what
# cargo-deny's `wildcards = "deny"` requires for a path dependency; crates pull
# it in with `gluestick-core = { workspace = true }`.
gluestick-core = { path = "crates/gluestick-core", version = "0.1.1" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
