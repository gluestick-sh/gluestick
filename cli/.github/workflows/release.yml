# Tag push: test → build → installer → GitHub Release → https://gluestick.sh/releases/cli/
# Manual: workflow_dispatch with an existing tag to re-sync that release to the site.
#
# Secrets (org recommended): GLUESTICK_SSH_HOST, GLUESTICK_SSH_PORT,
#   GLUESTICK_SSH_USER, GLUESTICK_SSH_KEY, GLUESTICK_SSH_PATH,
#   optional GLUESTICK_SSH_PASSPHRASE / GLUESTICK_SSH_KNOWN_HOSTS
# Upload target: $GLUESTICK_SSH_PATH/cli/ → https://gluestick.sh/releases/cli/

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to sync to gluestick.sh (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    if: github.event_name == 'push'
    name: test + smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Test
        run: go test ./glue/... -count=1 -timeout 5m

      - name: Build and smoke (amd64)
        shell: pwsh
        run: |
          go build -o glue.exe ./glue
          .\glue.exe --help

  build:
    if: github.event_name == 'push'
    name: build glue-${{ matrix.goarch }}.exe
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Build glue.exe
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          out="glue-windows-${{ matrix.goarch }}.exe"
          go build -trimpath \
            -ldflags "-s -w -X github.com/gluestick-sh/cli/version.Version=${version} -X github.com/gluestick-sh/cli/version.Commit=${GITHUB_SHA} -X github.com/gluestick-sh/cli/version.Date=${date}" \
            -o "$out" ./glue
          sha256sum "$out" | awk '{print $1}' > "$out.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: glue-windows-${{ matrix.goarch }}
          path: |
            glue-windows-${{ matrix.goarch }}.exe
            glue-windows-${{ matrix.goarch }}.exe.sha256

  build-installer:
    if: github.event_name == 'push'
    name: build GlueSetup-${{ matrix.goarch }}.exe
    runs-on: windows-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: glue-windows-${{ matrix.goarch }}
          path: dist

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Verify glue artifact
        shell: pwsh
        run: |
          $glue = "dist\glue-windows-${{ matrix.goarch }}.exe"
          if (-not (Test-Path -LiteralPath $glue)) {
            throw "missing glue artifact: $glue"
          }

      - name: Build NSIS installer
        shell: pwsh
        working-directory: installer
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION -replace '^v', ''
          $glue = "..\dist\glue-windows-${{ matrix.goarch }}.exe"
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              .\build-installer.ps1 -Arch "${{ matrix.goarch }}" -Version $version -SkipBuildGlue -GlueExe $glue
              break
            } catch {
              if ($attempt -eq $maxAttempts) { throw }
              Write-Warning "Installer build failed (attempt $attempt/$maxAttempts): $_"
              Start-Sleep -Seconds 15
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: glue-setup-windows-${{ matrix.goarch }}
          path: |
            installer/output/GlueSetup-${{ matrix.goarch }}.exe
            installer/output/GlueSetup-${{ matrix.goarch }}.exe.sha256

  release:
    if: github.event_name == 'push'
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, build-installer]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: glue-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

      - uses: actions/upload-artifact@v7
        with:
          name: cli-release
          path: |
            dist/GlueSetup-amd64.exe
            dist/GlueSetup-arm64.exe
            dist/GlueSetup-amd64.exe.sha256
            dist/GlueSetup-arm64.exe.sha256
            dist/glue-windows-amd64.exe
            dist/glue-windows-arm64.exe
            dist/glue-windows-amd64.exe.sha256
            dist/glue-windows-arm64.exe.sha256
          if-no-files-found: error

  sync-web:
    if: github.event_name == 'workflow_dispatch'
    name: sync from existing release
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" -R "${{ github.repository }}" -D dist \
            -p 'GlueSetup-amd64.exe' \
            -p 'GlueSetup-arm64.exe' \
            -p 'GlueSetup-amd64.exe.sha256' \
            -p 'GlueSetup-arm64.exe.sha256' \
            -p 'glue-windows-amd64.exe' \
            -p 'glue-windows-arm64.exe' \
            -p 'glue-windows-amd64.exe.sha256' \
            -p 'glue-windows-arm64.exe.sha256'
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: cli-release
          path: |
            dist/GlueSetup-amd64.exe
            dist/GlueSetup-arm64.exe
            dist/GlueSetup-amd64.exe.sha256
            dist/GlueSetup-arm64.exe.sha256
            dist/glue-windows-amd64.exe
            dist/glue-windows-arm64.exe
            dist/glue-windows-amd64.exe.sha256
            dist/glue-windows-arm64.exe.sha256
          if-no-files-found: error

  publish-web:
    name: publish to gluestick.sh
    runs-on: ubuntu-latest
    needs: [release, sync-web]
    if: |
      always() && !cancelled() && (
        needs.release.result == 'success' ||
        needs.sync-web.result == 'success'
      )
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cli-release
          path: dist

      - name: Setup SSH
        env:
          SSH_HOST: ${{ secrets.GLUESTICK_SSH_HOST }}
          SSH_PORT: ${{ secrets.GLUESTICK_SSH_PORT }}
          SSH_KEY: ${{ secrets.GLUESTICK_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.GLUESTICK_SSH_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.GLUESTICK_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Prefer env + printf so multiline PEM secrets stay intact.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

          # Unlock encrypted keys once for later -i IdentitiesOnly=yes commands.
          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            eval "$(ssh-agent -s)"
            export SSH_PASSPHRASE
            printf '%s\n' '#!/bin/sh' 'printf "%s\n" "$SSH_PASSPHRASE"' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            DISPLAY=:0 SSH_ASKPASS="$HOME/.ssh/askpass.sh" SSH_ASKPASS_REQUIRE=force \
              ssh-add ~/.ssh/deploy_key </dev/null
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          fi

      - name: Test SSH
        env:
          SSH_HOST: ${{ secrets.GLUESTICK_SSH_HOST }}
          SSH_PORT: ${{ secrets.GLUESTICK_SSH_PORT }}
          SSH_USER: ${{ secrets.GLUESTICK_SSH_USER }}
        run: |
          set -euo pipefail
          ssh \
            -p "${SSH_PORT}" \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "whoami"

      - name: Deploy to gluestick.sh/releases/cli/
        env:
          SSH_HOST: ${{ secrets.GLUESTICK_SSH_HOST }}
          SSH_PORT: ${{ secrets.GLUESTICK_SSH_PORT }}
          SSH_USER: ${{ secrets.GLUESTICK_SSH_USER }}
          SSH_PATH: ${{ secrets.GLUESTICK_SSH_PATH }}
        run: |
          set -euo pipefail
          remote_dir="${SSH_PATH%/}/cli"
          ssh_opts=(-p "${SSH_PORT}" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)

          ls -la dist/

          ssh "${ssh_opts[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p $(printf %q "$remote_dir")"

          # scp uses -P for port (capital P).
          scp \
            -P "${SSH_PORT}" \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            dist/GlueSetup-amd64.exe \
            dist/GlueSetup-arm64.exe \
            dist/GlueSetup-amd64.exe.sha256 \
            dist/GlueSetup-arm64.exe.sha256 \
            dist/glue-windows-amd64.exe \
            dist/glue-windows-arm64.exe \
            dist/glue-windows-amd64.exe.sha256 \
            dist/glue-windows-arm64.exe.sha256 \
            "${SSH_USER}@${SSH_HOST}:${remote_dir}/"

          echo "public URL: https://gluestick.sh/releases/cli/"
